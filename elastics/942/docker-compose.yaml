
services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - ../certs:/usr/share/elasticsearch/config/certs
      - ./credentials:/credentials
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: es02\n"\
          "    dns:\n"\
          "      - es02\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 \{\} \;;
        find . -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u elastic:${ELASTIC_PASSWORD} -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        echo "Checking/Generating API key for elastic user";
        KEY_EXISTS=false;
        if [ -f /credentials/elastic_api_key.txt ]; then
          EXISTING_KEY=$$(cat /credentials/elastic_api_key.txt | tr -d "\r\n");
          if [ -n "$$EXISTING_KEY" ] && curl -s --cacert config/certs/ca/ca.crt -H "Authorization: ApiKey $${EXISTING_KEY}" https://es01:9200/_security/_authenticate | grep -q "\"username\":\"elastic\""; then
            echo "Valid API key already exists. Skipping generation.";
            KEY_EXISTS=true;
          fi;
        fi;
        if [ "$${KEY_EXISTS}" != "true" ]; then
          echo "Generating new API key...";
          RESPONSE=$$(curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_security/api_key -d "{\"name\":\"startup_elastic_key\"}");
          API_KEY=$$(echo "$$RESPONSE" | sed -nE "s/.*\"encoded\":\"([^\"]+)\".*/\1/p");
          if [ -n "$$API_KEY" ]; then
            echo "$$API_KEY" > /credentials/elastic_api_key.txt;
            echo "ELASTIC_API_KEY=$$API_KEY" > /credentials/elastic_api_key.env;
            echo "KIBANA_API_KEY=$$API_KEY" >> /credentials/elastic_api_key.env;
            chmod 644 /credentials/elastic_api_key.txt /credentials/elastic_api_key.env;
            echo "API key generated successfully at /credentials/elastic_api_key.txt";
          else
            echo "Failed to generate API key: $$RESPONSE";
          fi;
        fi;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  es01:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    privileged: true
    volumes:
      - ../certs:/usr/share/elasticsearch/config/certs
    ports:
      - ${ES_PORT}:9200
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=es01,es02
      - discovery.seed_hosts=es02
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=false
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.http.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
    mem_limit: ${MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  es02:
    depends_on:
      - es01
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    privileged: true
    volumes:
      - ../certs:/usr/share/elasticsearch/config/certs
    environment:
      - node.name=es02
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=es01,es02
      - discovery.seed_hosts=es01
      - bootstrap.memory_lock=false
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es02/es02.key
      - xpack.security.http.ssl.certificate=certs/es02/es02.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.http.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es02/es02.key
      - xpack.security.transport.ssl.certificate=certs/es02/es02.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
    mem_limit: ${MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
  kibana:
    depends_on:
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    privileged: true
    volumes:
      - ../certs:/usr/share/kibana/config/certs
    ports:
      - ${KIBANA_PORT}:5601
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY}
      - XPACK_SECURITY_ENCRYPTIONKEY=${XPACK_SECURITY_ENCRYPTIONKEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${XPACK_REPORTING_ENCRYPTIONKEY}
      - NODE_OPTIONS=--max-old-space-size=2048
    mem_limit: ${MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
  fleet-setup:
    build:
      context: ./fleet-setup
    privileged: true
    depends_on:
      kibana:
        condition: service_healthy      
    tty: true
    volumes:
      - ../certs:/certs
      - ./fleet_server_files/es_install:/opt/Elastic
      - ./fleet_shared:/root/fleet_shared
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - FLEET_SERVER_ELASTICSEARCH_CA=/certs/ca/ca.crt
      - FLEET_INSECURE=true
    command: >
      bash -c '
      until curl -s -X POST -u "elastic:${ELASTIC_PASSWORD}" -H "kbn-xsrf: true" "http://kibana:5601/api/fleet/setup" | grep -q "isInitialized.*true"; do
        echo "attempting to setup fleet...";
        sleep 5;
      done;
      echo "adding fleet outputs...";
      until curl -s -X PUT "http://kibana:5601/api/fleet/outputs/fleet-default-output" -H "kbn-xsrf: true" -H "Content-Type: application/json" -u "elastic:${ELASTIC_PASSWORD}" -d "{\"name\": \"default\", \"type\": \"elasticsearch\", \"is_default\": true, \"is_default_monitoring\": true, \"hosts\": [\"https://es01:9200\",\"https://es02:9200\"], \"config_yaml\": \"ssl.verification_mode: none\"}" | grep -q "item"; do
        echo "attempting to add fleet outputs...";
        sleep 5;
      done;
      echo "adding fleet server hosts...";
      curl -s -X POST "http://kibana:5601/api/fleet/fleet_server_hosts" -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" -H "kbn-xsrf: true" -d "{\"host_urls\": [\"https://fleetsrv:8220\"], \"is_default\": true, \"name\": \"fleetsrv\"}";

      echo "creating fleet policy...";
      curl -s -X POST -u "elastic:${ELASTIC_PASSWORD}" -H "kbn-xsrf: true" "http://kibana:5601/api/fleet/agent_policies?sys_monitoring=true" -H "Content-Type: application/json" -d "{\"name\":\"fleet-server-policy\",\"description\":\"default generated fleet policy\",\"namespace\":\"default\",\"monitoring_enabled\":[\"logs\",\"metrics\",\"traces\"],\"is_protected\":false,\"has_fleet_server\":true}";

      echo "generating service token...";
      curl -s -X POST "http://kibana:5601/api/fleet/service_tokens" -H "kbn-xsrf: true" -u "elastic:${ELASTIC_PASSWORD}" | sed -E "s/.*\"value\":\"([^\"]+)\".*/\1/" > /root/fleet_shared/token.txt;
      echo "fleet configured!";
      echo "my work here is done";
      '
  fleet-server:
    hostname: fleetsrv
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION}
    ports:
      - "8220:8220"
    depends_on:
      fleet-setup:
        condition: service_completed_successfully
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../certs:/certs
      - ./fleet_shared:/root/fleet_shared
    environment:
      - FLEET_SERVER_ENABLE=true
      - FLEET_SERVER_POLICY_NAME=fleet-server-policy
      - FLEET_SERVER_ELASTICSEARCH_HOST=https://es01:9200
      - FLEET_SERVER_ELASTICSEARCH_CA=/certs/ca/ca.crt
      - FLEET_SERVER_PORT=8220
      - FLEET_INSECURE=true
    entrypoint: >
      /bin/sh -c '
      until [ -f /root/fleet_shared/token.txt ]; do
        echo "Waiting for fleet setup token...";
        sleep 2;
      done;
      export FLEET_SERVER_SERVICE_TOKEN=$$(cat /root/fleet_shared/token.txt);
      echo "Starting Fleet Server with token...";
      exec /usr/bin/tini -- /usr/share/elastic-agent/elastic-agent container
      '
  gitlab:
    image: gitlab/gitlab-ce:latest
    ports:
      - "8080:80"
      - "8443:443"
      - "2022:22"
    privileged: true
    volumes:
      - ./gitlab_data_varlib:/var/lib/gitlab
      - ./gitlab_data_config:/etc/gitlab
      - ./gitlab_data_logs:/var/log/gitlab
      #- ./gitlab_data_opt:/opt/gitlab
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    volumes:
      - ./gitlab_runner_data_config:/etc/gitlab-runner
      - ./gitlab_runner_data_varlib:/var/lib/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
  client2:
    build:
      context: ./devmachine
    privileged: true
    entrypoint: >
      /bin/sh -c '
      mkdir /home/;
      cd /home;
      apt-get update -qq && apt-get install -y -qq git > /dev/null;
      git clone "https://github.com/elastic/detection-rules.git";
      '
  client3:
    hostname: "client3"
    pid: "host"
    cap_add:
      - SYS_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../certs:/certs
    build:
      context: ./devmachine
    privileged: true
networks:
  default:
    name: elastic-stack-network
volumes:
  certs:
    driver: local
  esdata01:
    driver: local
  esdata02:
    driver: local
  kibanadata:
    driver: local
